<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="200" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Text Preprocessing Pipeline</text>

  <g font-size="12" text-anchor="middle">
    <rect x="20" y="60" width="120" height="55" fill="#164e63" stroke="#22d3ee" stroke-width="2" rx="8"/>
    <text x="80" y="92" fill="#f8fafc">Lowercasing</text>

    <rect x="165" y="60" width="120" height="55" fill="#3730a3" stroke="#818cf8" stroke-width="2" rx="8"/>
    <text x="225" y="92" fill="#f8fafc">Tokenization</text>

    <rect x="310" y="60" width="130" height="55" fill="#4c1d95" stroke="#c084fc" stroke-width="2" rx="8"/>
    <text x="375" y="85" fill="#f8fafc">Subword</text>
    <text x="375" y="100" fill="#f8fafc">Tokenization</text>

    <rect x="465" y="60" width="130" height="55" fill="#7c2d12" stroke="#fb923c" stroke-width="2" rx="8"/>
    <text x="530" y="85" fill="#f8fafc">Stop-word</text>
    <text x="530" y="100" fill="#f8fafc">Removal</text>

    <rect x="620" y="60" width="120" height="55" fill="#065f46" stroke="#34d399" stroke-width="2" rx="8"/>
    <text x="680" y="85" fill="#f8fafc">Stemming /</text>
    <text x="680" y="100" fill="#f8fafc">Lemmatization</text>

    <rect x="765" y="60" width="115" height="55" fill="#831843" stroke="#f472b6" stroke-width="2" rx="8"/>
    <text x="822" y="85" fill="#f8fafc">Vectorization</text>
    <text x="822" y="100" fill="#f8fafc">(BoW/TF-IDF)</text>
  </g>

  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow5)">
    <line x1="140" y1="87" x2="161" y2="87"/>
    <line x1="285" y1="87" x2="306" y2="87"/>
    <line x1="440" y1="87" x2="461" y2="87"/>
    <line x1="595" y1="87" x2="616" y2="87"/>
    <line x1="740" y1="87" x2="761" y2="87"/>
  </g>

  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="450" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">"I Love NLP" → ["i","love","nlp"] → removes stop words → root forms → numeric vectors</text>
</svg>
