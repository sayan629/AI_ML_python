<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="260" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">CNN Feature Extraction Pipeline (CIFAR-10)</text>

  <!-- Input -->
  <g text-anchor="middle">
    <rect x="20" y="70" width="90" height="90" fill="#164e63" stroke="#22d3ee" stroke-width="2" rx="6"/>
    <text x="65" y="120" fill="#f8fafc" font-size="13">32x32x3</text>
    <text x="65" y="175" fill="#94a3b8" font-size="11">Input Image</text>
  </g>

  <text x="140" y="120" fill="#64748b" font-size="20">→</text>

  <!-- Conv block 1 -->
  <g text-anchor="middle">
    <rect x="160" y="60" width="80" height="80" fill="#3730a3" stroke="#818cf8" stroke-width="2" rx="6"/>
    <rect x="185" y="80" width="80" height="80" fill="#4338ca" stroke="#818cf8" stroke-width="2" rx="6" opacity="0.85"/>
    <text x="225" y="185" fill="#94a3b8" font-size="11">Conv+ReLU+Pool</text>
    <text x="225" y="200" fill="#f8fafc" font-size="12">(32,32,32)</text>
    <text x="225" y="217" fill="#22d3ee" font-size="12">→ (16,16,32)</text>
  </g>

  <text x="300" y="120" fill="#64748b" font-size="20">→</text>

  <!-- Conv block 2 -->
  <g text-anchor="middle">
    <rect x="330" y="65" width="65" height="70" fill="#4c1d95" stroke="#c084fc" stroke-width="2" rx="6"/>
    <rect x="350" y="82" width="65" height="70" fill="#5b21b6" stroke="#c084fc" stroke-width="2" rx="6" opacity="0.85"/>
    <text x="390" y="185" fill="#94a3b8" font-size="11">Conv+ReLU+Pool</text>
    <text x="390" y="200" fill="#f8fafc" font-size="12">(16,16,64)</text>
    <text x="390" y="217" fill="#22d3ee" font-size="12">→ (8,8,64)</text>
  </g>

  <text x="465" y="120" fill="#64748b" font-size="20">→</text>

  <!-- Conv block 3 -->
  <g text-anchor="middle">
    <rect x="490" y="70" width="50" height="60" fill="#7c2d12" stroke="#fb923c" stroke-width="2" rx="6"/>
    <rect x="505" y="85" width="50" height="60" fill="#9a3412" stroke="#fb923c" stroke-width="2" rx="6" opacity="0.85"/>
    <text x="545" y="185" fill="#94a3b8" font-size="11">Conv+ReLU+Pool</text>
    <text x="545" y="200" fill="#f8fafc" font-size="12">(8,8,128)</text>
    <text x="545" y="217" fill="#22d3ee" font-size="12">→ (4,4,128)</text>
  </g>

  <text x="610" y="120" fill="#64748b" font-size="20">→</text>

  <!-- Flatten / FC -->
  <g text-anchor="middle">
    <rect x="640" y="80" width="100" height="60" fill="#065f46" stroke="#34d399" stroke-width="2" rx="6"/>
    <text x="690" y="115" fill="#f8fafc" font-size="12">Flatten +</text>
    <text x="690" y="130" fill="#f8fafc" font-size="12">FC Layers</text>
    <text x="690" y="185" fill="#94a3b8" font-size="11">Fully Connected</text>
  </g>

  <text x="770" y="120" fill="#64748b" font-size="20">→</text>

  <g text-anchor="middle">
    <rect x="800" y="90" width="80" height="45" fill="#831843" stroke="#f472b6" stroke-width="2" rx="6"/>
    <text x="840" y="118" fill="#f8fafc" font-size="12">Output</text>
    <text x="840" y="185" fill="#94a3b8" font-size="11">10 classes</text>
  </g>

  <text x="450" y="245" text-anchor="middle" fill="#64748b" font-size="12">Output size = ((n − f + 2p) / s) + 1</text>
</svg>
