<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="380" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">LSTM Cell (Long Short-Term Memory)</text>

  <!-- Cell state line -->
  <line x1="60" y1="90" x2="840" y2="90" stroke="#22d3ee" stroke-width="3"/>
  <text x="65" y="75" fill="#22d3ee" font-size="12">Cell State (Long-term memory)</text>
  <text x="810" y="75" fill="#22d3ee" font-size="12">Cₜ</text>
  <text x="50" y="95" fill="#94a3b8" font-size="11" text-anchor="end">Cₜ₋₁</text>

  <!-- Forget gate multiply -->
  <circle cx="200" cy="90" r="14" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" fill="#f472b6" font-size="14">×</text>

  <!-- Addition -->
  <circle cx="500" cy="90" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" fill="#34d399" font-size="14">+</text>

  <!-- Forget gate box -->
  <rect x="170" y="200" width="60" height="35" fill="#7c2d12" stroke="#fb923c" stroke-width="2" rx="4"/>
  <text x="200" y="223" text-anchor="middle" fill="#f8fafc" font-size="14">σ</text>
  <text x="200" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Forget Gate (Fₜ)</text>
  <line x1="200" y1="200" x2="200" y2="104" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Input gate box -->
  <rect x="330" y="200" width="60" height="35" fill="#4c1d95" stroke="#c084fc" stroke-width="2" rx="4"/>
  <text x="360" y="223" text-anchor="middle" fill="#f8fafc" font-size="14">σ</text>
  <text x="360" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Input Gate (Iₜ)</text>

  <!-- Candidate memory -->
  <rect x="440" y="200" width="70" height="35" fill="#3730a3" stroke="#818cf8" stroke-width="2" rx="4"/>
  <text x="475" y="223" text-anchor="middle" fill="#f8fafc" font-size="13">tanh</text>
  <text x="475" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Candidate Memory (C̃ₜ)</text>

  <!-- input*candidate multiply -->
  <circle cx="475" cy="150" r="14" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
  <text x="475" y="155" text-anchor="middle" fill="#c084fc" font-size="14">×</text>
  <line x1="360" y1="200" x2="465" y2="158" stroke="#c084fc" stroke-width="2"/>
  <line x1="475" y1="200" x2="475" y2="164" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="475" y1="136" x2="495" y2="100" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Output gate -->
  <rect x="650" y="200" width="60" height="35" fill="#065f46" stroke="#34d399" stroke-width="2" rx="4"/>
  <text x="680" y="223" text-anchor="middle" fill="#f8fafc" font-size="14">σ</text>
  <text x="680" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Output Gate (Oₜ)</text>

  <!-- tanh(Ct) then multiply with Ot -->
  <rect x="700" y="120" width="55" height="30" fill="#0f172a" stroke="#22d3ee" stroke-width="2" rx="15"/>
  <text x="727" y="140" text-anchor="middle" fill="#22d3ee" font-size="12">tanh</text>
  <line x1="700" y1="90" x2="727" y2="120" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="727" cy="185" r="14" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="727" y="190" text-anchor="middle" fill="#34d399" font-size="14">×</text>
  <line x1="727" y1="150" x2="727" y2="171" stroke="#22d3ee" stroke-width="2"/>
  <line x1="680" y1="200" x2="717" y2="190" stroke="#34d399" stroke-width="2"/>
  <line x1="727" y1="199" x2="727" y2="280" stroke="#34d399" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="760" y="285" fill="#34d399" font-size="12">Hₜ</text>

  <!-- Hidden state / input line -->
  <line x1="60" y1="280" x2="840" y2="280" stroke="#fbbf24" stroke-width="2"/>
  <text x="50" y="285" text-anchor="end" fill="#fbbf24" font-size="11">Hₜ₋₁</text>
  <text x="80" y="300" fill="#fbbf24" font-size="11">Short-term memory (Hidden State)</text>

  <line x1="200" y1="280" x2="200" y2="235" stroke="#fbbf24" stroke-width="2"/>
  <line x1="360" y1="280" x2="360" y2="235" stroke="#fbbf24" stroke-width="2"/>
  <line x1="475" y1="280" x2="475" y2="235" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="680" y1="280" x2="680" y2="235" stroke="#fbbf24" stroke-width="2"/>

  <!-- Input Xt -->
  <line x1="320" y1="340" x2="320" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="320" y="360" text-anchor="middle" fill="#94a3b8" font-size="12">Input Xₜ (concatenated with Hₜ₋₁)</text>

  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
