<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="320" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">RNN Unrolled Through Time</text>

  <!-- Time steps -->
  <g font-size="12" text-anchor="middle">
    <!-- t1 -->
    <rect x="90" y="110" width="70" height="90" fill="#3730a3" stroke="#818cf8" stroke-width="2" rx="8"/>
    <text x="125" y="160" fill="#f8fafc" font-size="13">h₁</text>
    <line x1="125" y1="220" x2="125" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="125" y="240" fill="#94a3b8">x₁ (vacation)</text>
    <line x1="125" y1="110" x2="125" y2="85" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="125" y="75" fill="#22d3ee">ŷ₁</text>

    <!-- t2 -->
    <rect x="270" y="110" width="70" height="90" fill="#3730a3" stroke="#818cf8" stroke-width="2" rx="8"/>
    <text x="305" y="160" fill="#f8fafc" font-size="13">h₂</text>
    <line x1="305" y1="220" x2="305" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="305" y="240" fill="#94a3b8">x₂ (is)</text>
    <line x1="305" y1="110" x2="305" y2="85" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="305" y="75" fill="#22d3ee">ŷ₂</text>

    <!-- t3 -->
    <rect x="450" y="110" width="70" height="90" fill="#3730a3" stroke="#818cf8" stroke-width="2" rx="8"/>
    <text x="485" y="160" fill="#f8fafc" font-size="13">h₃</text>
    <line x1="485" y1="220" x2="485" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="485" y="240" fill="#94a3b8">x₃ (going)</text>
    <line x1="485" y1="110" x2="485" y2="85" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="485" y="75" fill="#22d3ee">ŷ₃</text>

    <!-- t4 -->
    <rect x="630" y="110" width="70" height="90" fill="#3730a3" stroke="#818cf8" stroke-width="2" rx="8"/>
    <text x="665" y="160" fill="#f8fafc" font-size="13">h₄</text>
    <line x1="665" y1="220" x2="665" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="665" y="240" fill="#94a3b8">x₄ (great)</text>
    <line x1="665" y1="110" x2="665" y2="85" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
    <text x="665" y="75" fill="#22d3ee">ŷ₄</text>
  </g>

  <!-- horizontal connections h0->h1->h2->h3->h4 -->
  <g stroke="#f59e0b" stroke-width="2" fill="none">
    <line x1="40" y1="155" x2="86" y2="155" marker-end="url(#arrow3)"/>
    <line x1="160" y1="155" x2="266" y2="155" marker-end="url(#arrow3)"/>
    <line x1="340" y1="155" x2="446" y2="155" marker-end="url(#arrow3)"/>
    <line x1="520" y1="155" x2="626" y2="155" marker-end="url(#arrow3)"/>
    <line x1="700" y1="155" x2="740" y2="155" marker-end="url(#arrow3)"/>
  </g>
  <text x="63" y="145" fill="#fbbf24" font-size="11">h₀,Wₕ</text>
  <text x="213" y="145" fill="#fbbf24" font-size="11">h₁,Wₕ</text>
  <text x="393" y="145" fill="#fbbf24" font-size="11">h₂,Wₕ</text>
  <text x="573" y="145" fill="#fbbf24" font-size="11">h₃,Wₕ</text>

  <text x="450" y="280" text-anchor="middle" fill="#64748b" font-size="12">Parameter sharing: same Wₓ and Wₕ used at every time step</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
