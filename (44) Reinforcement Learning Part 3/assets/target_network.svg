<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial,sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="12"/>
<text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Policy Network vs Target Network</text>
<rect x="50" y="70" width="240" height="90" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="170" y="102" text-anchor="middle" font-weight="bold" fill="#1e40af">Policy / Online Net (θ)</text>
<text x="170" y="128" text-anchor="middle" fill="#475569">Updated every step</text>
<text x="170" y="146" text-anchor="middle" fill="#475569">Predicts Q(s, a; θ)</text>
<rect x="410" y="70" width="240" height="90" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
<text x="530" y="102" text-anchor="middle" font-weight="bold" fill="#9d174d">Target Net (θ⁻)</text>
<text x="530" y="128" text-anchor="middle" fill="#475569">Weights frozen for C steps</text>
<text x="530" y="146" text-anchor="middle" fill="#475569">y = r + γ max Q(s', a'; θ⁻)</text>
<line x1="292" y1="115" x2="408" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6,4"/>
<text x="350" y="105" text-anchor="middle" font-size="12" fill="#475569">copy θ → θ⁻</text>
<text x="350" y="135" text-anchor="middle" font-size="12" fill="#475569">every C steps</text>
<rect x="215" y="230" width="270" height="50" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="350" y="260" text-anchor="middle" fill="#92400e" font-weight="bold">Loss = (y − Q(s,a;θ))²</text>
<path d="M170 162 V255 H213" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M530 162 V255 H487" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
</svg>
