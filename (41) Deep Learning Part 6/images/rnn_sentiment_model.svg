<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="340" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Many-to-One RNN for Sentiment Classification</text>

  <!-- words -->
  <g font-size="13" text-anchor="middle" fill="#cbd5e1">
    <text x="130" y="315">"This"</text>
    <text x="270" y="315">"movie"</text>
    <text x="410" y="315">"was"</text>
    <text x="550" y="315">"very"</text>
    <text x="690" y="315">"good"</text>
  </g>

  <!-- embeddings -->
  <g font-size="11" text-anchor="middle" fill="#f8fafc">
    <rect x="95" y="235" width="70" height="35" rx="6" fill="#831843" stroke="#f472b6" stroke-width="2"/><text x="130" y="257">Embed</text>
    <rect x="235" y="235" width="70" height="35" rx="6" fill="#831843" stroke="#f472b6" stroke-width="2"/><text x="270" y="257">Embed</text>
    <rect x="375" y="235" width="70" height="35" rx="6" fill="#831843" stroke="#f472b6" stroke-width="2"/><text x="410" y="257">Embed</text>
    <rect x="515" y="235" width="70" height="35" rx="6" fill="#831843" stroke="#f472b6" stroke-width="2"/><text x="550" y="257">Embed</text>
    <rect x="655" y="235" width="70" height="35" rx="6" fill="#831843" stroke="#f472b6" stroke-width="2"/><text x="690" y="257">Embed</text>
  </g>

  <!-- RNN cells -->
  <g font-size="13" text-anchor="middle" fill="#f8fafc">
    <rect x="95" y="140" width="70" height="60" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="2"/><text x="130" y="176">h₁</text>
    <rect x="235" y="140" width="70" height="60" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="2"/><text x="270" y="176">h₂</text>
    <rect x="375" y="140" width="70" height="60" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="2"/><text x="410" y="176">h₃</text>
    <rect x="515" y="140" width="70" height="60" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="2"/><text x="550" y="176">h₄</text>
    <rect x="655" y="140" width="70" height="60" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="2"/><text x="690" y="176">h₅</text>
  </g>

  <!-- word to embed arrows -->
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)">
    <line x1="130" y1="298" x2="130" y2="274"/>
    <line x1="270" y1="298" x2="270" y2="274"/>
    <line x1="410" y1="298" x2="410" y2="274"/>
    <line x1="550" y1="298" x2="550" y2="274"/>
    <line x1="690" y1="298" x2="690" y2="274"/>
    <line x1="130" y1="235" x2="130" y2="204"/>
    <line x1="270" y1="235" x2="270" y2="204"/>
    <line x1="410" y1="235" x2="410" y2="204"/>
    <line x1="550" y1="235" x2="550" y2="204"/>
    <line x1="690" y1="235" x2="690" y2="204"/>
  </g>

  <!-- hidden connections -->
  <g stroke="#f59e0b" stroke-width="2" marker-end="url(#a3)">
    <line x1="165" y1="170" x2="231" y2="170"/>
    <line x1="305" y1="170" x2="371" y2="170"/>
    <line x1="445" y1="170" x2="511" y2="170"/>
    <line x1="585" y1="170" x2="651" y2="170"/>
  </g>

  <!-- output -->
  <line x1="725" y1="170" x2="770" y2="140" stroke="#f59e0b" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="770" y="100" width="100" height="60" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="820" y="125" text-anchor="middle" fill="#f8fafc" font-size="12">FC + Sigmoid</text>
  <text x="820" y="145" text-anchor="middle" fill="#4ade80" font-size="12">→ Positive</text>

  <text x="430" y="70" text-anchor="middle" fill="#94a3b8" font-size="12">Final hidden state summarises the whole review</text>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
