<svg viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="230" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Training Loop</text>

  <g font-size="12" text-anchor="middle" fill="#f8fafc">
    <rect x="30" y="70" width="120" height="55" rx="8" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <text x="90" y="95">Input Batch</text><text x="90" y="111" fill="#94a3b8" font-size="10">x_batch, y_batch</text>

    <rect x="190" y="70" width="120" height="55" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
    <text x="250" y="95">Forward Pass</text><text x="250" y="111" fill="#94a3b8" font-size="10">model(x)</text>

    <rect x="350" y="70" width="120" height="55" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
    <text x="410" y="95">Calculate Loss</text><text x="410" y="111" fill="#94a3b8" font-size="10">criterion()</text>

    <rect x="510" y="70" width="120" height="55" rx="8" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/>
    <text x="570" y="95">Backpropagation</text><text x="570" y="111" fill="#94a3b8" font-size="10">loss.backward()</text>

    <rect x="670" y="70" width="120" height="55" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="730" y="95">Update Weights</text><text x="730" y="111" fill="#94a3b8" font-size="10">optimizer.step()</text>
  </g>

  <g stroke="#64748b" stroke-width="2" marker-end="url(#a4)" fill="none">
    <line x1="150" y1="97" x2="186" y2="97"/>
    <line x1="310" y1="97" x2="346" y2="97"/>
    <line x1="470" y1="97" x2="506" y2="97"/>
    <line x1="630" y1="97" x2="666" y2="97"/>
    <path d="M 730 125 L 730 175 L 90 175 L 90 129"/>
  </g>
  <text x="410" y="195" text-anchor="middle" fill="#94a3b8" font-size="12">repeat for every batch &amp; every epoch</text>

  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
</svg>
