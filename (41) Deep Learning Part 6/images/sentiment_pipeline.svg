<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="250" fill="#0f172a"/>
  <text x="450" y="32" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Sentiment Analysis Pipeline (IMDB + RNN)</text>

  <g font-size="12" text-anchor="middle" fill="#f8fafc">
    <rect x="15" y="70" width="95" height="60" rx="8" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <text x="62" y="97">IMDB</text><text x="62" y="113">Reviews</text>

    <rect x="130" y="70" width="95" height="60" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
    <text x="177" y="97">Text</text><text x="177" y="113">Cleaning</text>

    <rect x="245" y="70" width="95" height="60" rx="8" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/>
    <text x="292" y="97">Stopwords +</text><text x="292" y="113">Stemming</text>

    <rect x="360" y="70" width="95" height="60" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
    <text x="407" y="97">Tokenize +</text><text x="407" y="113">Pad</text>

    <rect x="475" y="70" width="95" height="60" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="522" y="97">Dataset +</text><text x="522" y="113">DataLoader</text>

    <rect x="590" y="70" width="95" height="60" rx="8" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <text x="637" y="97">Embedding</text><text x="637" y="113">Layer</text>

    <rect x="705" y="70" width="80" height="60" rx="8" fill="#713f12" stroke="#facc15" stroke-width="2"/>
    <text x="745" y="105">RNN</text>

    <rect x="800" y="70" width="85" height="60" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="842" y="97">FC +</text><text x="842" y="113">Sigmoid</text>
  </g>

  <g stroke="#64748b" stroke-width="2" marker-end="url(#a1)">
    <line x1="110" y1="100" x2="126" y2="100"/>
    <line x1="225" y1="100" x2="241" y2="100"/>
    <line x1="340" y1="100" x2="356" y2="100"/>
    <line x1="455" y1="100" x2="471" y2="100"/>
    <line x1="570" y1="100" x2="586" y2="100"/>
    <line x1="685" y1="100" x2="701" y2="100"/>
    <line x1="785" y1="100" x2="796" y2="100"/>
  </g>

  <rect x="250" y="170" width="190" height="45" rx="22" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="345" y="198" text-anchor="middle" fill="#f8fafc" font-size="14">🟢 Positive Review</text>
  <rect x="460" y="170" width="190" height="45" rx="22" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
  <text x="555" y="198" text-anchor="middle" fill="#f8fafc" font-size="14">🔴 Negative Review</text>
  <text x="450" y="160" text-anchor="middle" fill="#94a3b8" font-size="12">Final prediction</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
