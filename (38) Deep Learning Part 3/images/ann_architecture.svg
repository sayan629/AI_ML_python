    <line x1="336" y1="250" x2="484" y2="350"/>

    <line x1="336" y1="300" x2="484" y2="100"/>
    <line x1="336" y1="300" x2="484" y2="150"/>
    <line x1="336" y1="300" x2="484" y2="200"/>
    <line x1="336" y1="300" x2="484" y2="250"/>
    <line x1="336" y1="300" x2="484" y2="300"/>
    <line x1="336" y1="300" x2="484" y2="350"/>

    <line x1="336" y1="350" x2="484" y2="100"/>
