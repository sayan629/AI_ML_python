<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="380" fill="#0f172a"/>

  <text x="380" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">ANN Architecture for Regression</text>

  <!-- Input layer -->
  <g>
    <text x="110" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Input Layer</text>
    <circle cx="110" cy="120" r="16" fill="#22c55e"/>
    <circle cx="110" cy="180" r="16" fill="#22c55e"/>
    <circle cx="110" cy="240" r="16" fill="#22c55e"/>
    <circle cx="110" cy="300" r="16" fill="#22c55e"/>
    <text x="110" y="345" text-anchor="middle" fill="#64748b" font-size="12">(n features)</text>
  </g>

  <!-- Hidden layer 1 -->
  <g>
    <text x="320" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Hidden Layer 1</text>
    <circle cx="320" cy="100" r="16" fill="#3b82f6"/>
    <circle cx="320" cy="150" r="16" fill="#3b82f6"/>
    <circle cx="320" cy="200" r="16" fill="#3b82f6"/>
    <circle cx="320" cy="250" r="16" fill="#3b82f6"/>
    <circle cx="320" cy="300" r="16" fill="#3b82f6"/>
    <circle cx="320" cy="350" r="16" fill="#3b82f6"/>
    <text x="320" y="368" text-anchor="middle" fill="#64748b" font-size="12">Linear(n,6) + ReLU</text>
  </g>

  <!-- Hidden layer 2 -->
  <g>
    <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Hidden Layer 2</text>
    <circle cx="500" cy="100" r="16" fill="#a855f7"/>
    <circle cx="500" cy="150" r="16" fill="#a855f7"/>
    <circle cx="500" cy="200" r="16" fill="#a855f7"/>
    <circle cx="500" cy="250" r="16" fill="#a855f7"/>
    <circle cx="500" cy="300" r="16" fill="#a855f7"/>
    <circle cx="500" cy="350" r="16" fill="#a855f7"/>
    <text x="500" y="368" text-anchor="middle" fill="#64748b" font-size="12">Linear(6,6) + ReLU</text>
  </g>

  <!-- Output layer -->
  <g>
    <text x="680" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Output Layer</text>
    <circle cx="680" cy="210" r="16" fill="#f97316"/>
    <text x="680" y="255" text-anchor="middle" fill="#64748b" font-size="12">Linear(6,1)</text>
  </g>

