  <circle cx="320" cy="300" r="16" fill="#3b82f6"/>
  <circle cx="320" cy="350" r="16" fill="#3b82f6"/>

  <circle cx="500" cy="100" r="16" fill="#a855f7"/>
  <circle cx="500" cy="150" r="16" fill="#a855f7"/>
  <circle cx="500" cy="200" r="16" fill="#a855f7"/>
  <circle cx="500" cy="250" r="16" fill="#a855f7"/>
  <circle cx="500" cy="300" r="16" fill="#a855f7"/>
  <circle cx="500" cy="350" r="16" fill="#a855f7"/>

