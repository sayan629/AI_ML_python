<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="220" fill="#0f172a"/>

  <!-- Boxes -->
  <g font-size="14" fill="#f8fafc" text-anchor="middle">
    <rect x="20" y="80" width="120" height="60" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <text x="80" y="115">Raw Data</text>

    <rect x="180" y="80" width="130" height="60" rx="10" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
    <text x="245" y="108">Train/Test</text>
    <text x="245" y="126">Split + Scale</text>

    <rect x="350" y="80" width="120" height="60" rx="10" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/>
    <text x="410" y="115">Tensors</text>

    <rect x="510" y="80" width="150" height="60" rx="10" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
    <text x="585" y="108">TensorDataset</text>
    <text x="585" y="126">/ DataLoader</text>

    <rect x="700" y="80" width="120" height="60" rx="10" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="760" y="108">ANN Model</text>
    <text x="760" y="126">Train + Eval</text>
  </g>

  <!-- Arrows -->
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="140" y1="110" x2="176" y2="110"/>
    <line x1="310" y1="110" x2="346" y2="110"/>
    <line x1="470" y1="110" x2="506" y2="110"/>
    <line x1="660" y1="110" x2="696" y2="110"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">End-to-End ANN Regression Pipeline</text>
  <text x="450" y="195" text-anchor="middle" fill="#64748b" font-size="12">Load → Split & Standardize → Convert → Batch → Train → Save → Evaluate</text>
</svg>
